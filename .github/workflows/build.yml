name: Build YTSideload dylib

on:
  push:
    branches: [ patch-1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          # ldid is not in standard Ubuntu repos — use pre-built binary from ProcursusTeam
          curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" \
            -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid
          ldid --version || true

      - name: Download iOS SDK
        run: |
          SDK_URL=$(curl -s https://api.github.com/repos/theos/sdks/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; \
              url=next((a['browser_download_url'] for a in assets if 'iPhoneOS' in a['name'] and a['name'].endswith('.tar.xz')), ''); \
              print(url)")
          echo "SDK URL: $SDK_URL"
          curl -fsSL "$SDK_URL" | tar -xJf - -C theos/sdks

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: make package THEOS_PACKAGE_SCHEME=rootless

      - name: Extract dylib
        run: |
          mkdir -p build
          DEB=$(ls -t packages/*.deb | head -1)
          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP"
          find "$TMP" -name "YTSideload.dylib" -exec cp {} build/YTSideload.dylib \;
          echo "Built:"
          ls -lh build/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTSideload-dylib
          path: build/YTSideload.dylib
          if-no-files-found: error
