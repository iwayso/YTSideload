name: Build YTSideload dylib

on:
  push:
    branches: [ patch-1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Link Xcode iOS SDK into Theos
        run: |
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          mkdir -p theos/sdks
          ln -sf "$XCODE_SDK" "theos/sdks/iPhoneOS${SDK_VER}.sdk"
          echo "SDK ${SDK_VER} linked at theos/sdks/"
          ls theos/sdks/

      - name: Build tweak
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make THEOS_PACKAGE_SCHEME=rootless
          echo "Build output:"
          find .theos/obj -name "*.dylib" 2>/dev/null || true

      - name: Collect dylib
        run: |
          mkdir -p build
          DYLIB=$(find .theos/obj -name "YTSideload.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "dylib not found in .theos/obj, searching broader..."
            find . -name "YTSideload.dylib" | grep -v '.git'
            exit 1
          fi
          cp "$DYLIB" build/YTSideload.dylib
          echo "Copied: $DYLIB -> build/YTSideload.dylib"
          ls -lh build/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTSideload-dylib
          path: build/YTSideload.dylib
          if-no-files-found: error
